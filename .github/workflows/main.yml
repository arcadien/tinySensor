name: PlatformIO CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]

jobs:
  # clang-format check, same version as .pre-commit-config.yaml
  lint:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install clang-format
        run: pip install clang-format==18.1.8
      - name: Check formatting
        # same command as the .rbd/config.yml linter (tinyDecoders included, .pio skipped)
        run: find emitter/src emitter/include emitter/test lib tinyDecoders -path '*/.pio' -prune -o \( -name '*.cpp' -o -name '*.h' \) -print | xargs clang-format --dry-run --Werror

  # Native Unity tests (Oregon / Lacrosse / X10 encoders, analog filter, ...)
  test-native:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('emitter/platformio.ini', 'tinyDecoders/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Run native tests
        run: pio test -d emitter -e native_debug -e native_cycle_oregon -e native_cycle_oregon_vcc -e native_cycle_oregon_divider -e native_cycle_lacrosse -e native_cycle_x10
      - name: Run tinyDecoders native tests
        run: pio test -d tinyDecoders -e native
      - name: Compile-fail checks
        run: |
          bash emitter/test/compile_fail/check_both_protocols.sh
          bash emitter/test/compile_fail/check_lacrosse_id_required.sh
      - name: Build variant checks
        run: bash emitter/test/build_variants/check_sensor_selection.sh

  # Firmware build for every physical target
  build-avr:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [S_02, S_03, S_04, S_05, robot, devmodule, SOLAR_TEST, mushroom]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('emitter/platformio.ini', 'tinyDecoders/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build firmware
        run: pio run -d emitter -e ${{ matrix.env }}
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            emitter/.pio/build/${{ matrix.env }}/firmware.hex
            emitter/.pio/build/${{ matrix.env }}/firmware.elf
          if-no-files-found: error
          retention-days: 30

  # 433 MHz receiver firmware: promicro (production), promini (alternative build)
  build-tinydecoders:
    name: Build tinyDecoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('emitter/platformio.ini', 'tinyDecoders/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      - name: Build firmware
        run: |
          pio run -d tinyDecoders -e promini
          pio run -d tinyDecoders -e promicro
      - name: Upload promini firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-tinydecoders-promini
          path: |
            tinyDecoders/.pio/build/promini/firmware.hex
            tinyDecoders/.pio/build/promini/firmware.elf
          if-no-files-found: error
          retention-days: 30
      - name: Upload promicro firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-tinydecoders-promicro
          path: |
            tinyDecoders/.pio/build/promicro/firmware.hex
            tinyDecoders/.pio/build/promicro/firmware.elf
          if-no-files-found: error
          retention-days: 30

  # Publish a GitHub Release with all firmware artifacts when a vX.Y.Z tag is pushed
  release:
    name: Release
    needs: [test-native, build-avr, build-tinydecoders]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: firmware
      # every artifact holds firmware.hex/.elf: rename them after the artifact (firmware-S_02 -> S_02.hex)
      - name: Name firmware files after their target
        run: |
          mkdir release
          for d in firmware/*/; do
            n=$(basename "$d"); n=${n#firmware-}
            for f in "$d"*; do cp "$f" "release/$n.${f##*.}"; done
          done
          ls release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
