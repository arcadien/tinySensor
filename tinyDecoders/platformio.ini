; tinyDecoders: 433 MHz receiver decoding tinySensor frames (docs/architecture.md)

; Host-native tests: builds the repository lib/ encoders and TestHal_ next to
; the decoders, so tests can feed decoders with real encoder output.
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../lib
build_flags = -DNATIVE

; Production receiver firmware: Pro Mini 5 V / 16 MHz (ATmega328P), standalone
; OLED viewer with RFLink lines on the debug UART (CONF-DECODE-004). Default
; upload: arduino protocol through the Pro Mini bootloader. 128 B serial TX
; buffer: room for two RFLink lines.
[env:promini]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
build_flags = -DSERIAL_TX_BUFFER_SIZE=128

; Receiver firmware with RFLink USB output: Pro Micro 5 V / 16 MHz
; (ATmega32U4), Arduino framework for the USB CDC stack (CONF-DECODE-003).
; Default upload: avr109 through the Caterina bootloader. Wire is in the core.
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
