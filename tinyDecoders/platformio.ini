; tinyDecoders: 433 MHz receiver decoding tinySensor frames (docs/architecture.md)

; Host-native tests: builds the repository lib/ encoders and TestHal_ next to
; the decoders, so tests can feed decoders with real encoder output.
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../lib
build_flags = -DNATIVE

; Receiver firmware: ATtiny84A at 8 MHz internal RC, no framework
; (CONF-DECODE-001). Only src/main.cpp and the libraries it includes are
; built: no ../lib encoders, no native-only Loopback or TestReceiverHal.
[env:attiny84a]
build_src_filter = -<*> +<main.cpp>
platform = atmelavr
board = attiny84
board_build.mcu = attiny84a
board_build.f_cpu = 8000000L
board_fuses.lfuse = 0xE2
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xFF
; 128 B of the 512 B SRAM are kept for the stack and interrupts
board_upload.maximum_size = 8192
board_upload.maximum_ram_size = 384
extra_scripts = post:scripts/check_size.py
build_type = release
; TinyI2C wants <Arduino.h> for its USI pin names: include/Arduino.h gives them
build_flags = -I include
lib_deps =
  tinyi2c=https://github.com/arcadien/tiny-i2c.git#38e7df377d900d163e76e7c165054640a2cf4238
upload_protocol = custom
upload_flags =
    -Pusb
    -pt84
    -v
    -c
    -b115200
    -B4
    -cavrisp2
upload_command = avrdude $UPLOAD_FLAGS -U flash:w:$SOURCE:i

; Receiver firmware with RFLink USB output: Pro Micro 5 V / 16 MHz
; (ATmega32U4), Arduino framework for the USB CDC stack (CONF-DECODE-003).
; Default upload: avr109 through the Caterina bootloader. Wire is in the core.
[env:promicro]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino
build_src_filter = -<*> +<main_promicro.cpp>
