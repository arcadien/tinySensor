exclusions:
  - id: HIST-BACKFILL-001
    finding: "test(ID) commits without implementation commits for FUNC-OREGON-001..013, FUNC-LACROSSE-001..009, FUNC-X10-001..007, FUNC-BATTERY-001, FUNC-BATTERY-003, FUNC-ANALOG-001, CONF-BUILD-005, CONF-BUILD-006, CONF-BUILD-008, CONF-BUILD-009, CONF-BUILD-010, PLAT-POWER-002, PLAT-POWER-004, TECH-HAL-001..003, TECH-HAL-005, TECH-FILTER-001, TECH-FILTER-002, TECH-CONVERT-002"
    justification: "The code predates the RBD workflow; the test commits tagged existing tests (FUNC-ANALOG-001 to PLAT-POWER-004 added on 2026-11-17 by 7f4c027, 6fdc43a, 4919547). Adding implementation commits would mean rewriting master history."
    date: 2026-11-17
  - id: HIST-COMMIT-MISMATCH-001
    finding: "Commit history mismatches for CONF-BUILD-002, CONF-BUILD-003, CONF-BUILD-013, FUNC-DECODE-003, FUNC-DECODE-005, TECH-SERIAL-001, CONF-BUILD-012, FUNC-SENSOR-003, PLAT-POWER-001, PLAT-POWER-003, TECH-HAL-001, TECH-DECODE-003, CONF-BUILD-007, CONF-BUILD-011"
    justification: "Merged history (chore: CI wiring, tests or code bundled in a neighbour commit). TECH-SERIAL-001 (6817d72 added its tests inside the tech commit), CONF-BUILD-012 (code in 0d775cc feat(FUNC-BATTERY-002), tag in d64fb61) and FUNC-SENSOR-003 (tags in a5987fb, tech: without ID) added on 2026-11-17 (audit 3, finding 10). It cannot change without rewriting master; the current tags and code are traced. Added on 2026-11-20 (audit 2026-11-20, finding 6): build/inspection requirements whose code predates RBD (TECH-HAL-001, CONF-BUILD-007, CONF-BUILD-011), was committed with fix(PLAT-POWER-003) (22eacc3), or under neighbour IDs (PLAT-POWER-001 under TECH-HAL-007, TECH-DECODE-003 under the FUNC-DECODE commits)."
    date: 2026-11-17
  - id: HIST-PREFIX-001
    finding: "Plan and architecture files changed by commits with the wrong prefix (.rbd/config.yml, requirements/technical.md, requirements/platform.md, docs/architecture.md)"
    justification: "Merged history from before the pre-push hook enforced prefixes. Rewriting master is not worth it; new commits go through the hook."
    date: 2026-11-17
  - id: TEST-GWT-001
    finding: "51 test functions in 10 emitter test files lack Given/When/Then markers"
    justification: "Tests written before the RBD workflow; adding the markers changes no behaviour. To be done if these files are reworked."
    date: 2026-11-17
  - id: SESSION-PREFIX-001
    finding: "bfdb0a6 (docs:) changed audits/exclusions.yml; cd584b8 (plan:) changed docs/architecture.md"
    justification: "Merged on master. bfdb0a6 should have been plan:, used from now on for exclusions. cd584b8 is a link-format pass over the whole architecture document with no single requirement; plan: is accepted for such whole-document format changes."
    date: 2026-11-17
  - id: RECEIVER-STATIC-HAL-001
    finding: "TECH-DECODE-002: the Receiver's injected ReceiverHal* is a compile-time typedef of AtmegaReceiverHal (TestReceiverHal in tests), not an abstract interface"
    justification: "Intentional static interface, documented in docs/architecture.md: no vtable on the ATmega328P receiver, the test HAL is swapped in at build time."
    date: 2026-11-17
  - id: DRAFT-TAG-DS18B20-001
    finding: "4 tests in emitter/test/test_ds18b20/ds18b20Test.cpp are tagged with the draft TECH-SENSOR-001"
    justification: "TECH-SENSOR-001 went back to draft pending the DS18B20 rework (PA3 release, 0 °C reading, FUNC-SENSOR-002). The tests still check the current driver wrapper; the tag stays so they are re-traced when the requirement is validated again."
    date: 2026-11-17
  - id: HIST-ARCH-REMOVED-ID-001
    finding: "ee76804 arch(CONF-DECODE-001) and b7b07fc arch(PLAT-DECODE-001) cite IDs later removed from the requirement files (aecbdb3, a25dc41)"
    justification: "The IDs were valid when committed (2026-11-09) and the tinyDecoders requirements were renumbered afterwards. Rewriting master is not worth it."
    date: 2026-11-20
  - id: TEXT-BACKREF-001
    finding: "A parent requirement cites in its text a child that lists it as a dependency (TECH-MAIN-001 / FUNC-MAIN-001, TECH-HAL-006; UI-DECODE-001 / FUNC-DECODE-007, UI-DECODE-003; PLAT-DECODE-005 / CONF-DECODE-004)"
    justification: "These citations give context (where the behaviour is specified), not a dependency: each parent is fully specified without the child, and the declared Dependencies graph has no cycle."
    date: 2026-11-20
  - id: STYLE-LAYOUT-001
    finding: "6132405 (style:) inserted blank lines between requirement fields in requirements/*.md"
    justification: "Layout only (354 blank lines, no text change), merged in PR #95 before the plan: rule was checked. Later layout changes to plan files use plan:."
    date: 2026-11-23
