<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>tinyDecoders receiver wiring (Pro Micro, RXB6, OLED 128x32)</title>
  <defs>
    <g id="gnd"><line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="2"/><line x1="-9" y1="8" x2="9" y2="8" stroke="#222" stroke-width="2"/><line x1="-6" y1="12" x2="6" y2="12" stroke="#222" stroke-width="2"/><line x1="-3" y1="16" x2="3" y2="16" stroke="#222" stroke-width="2"/></g>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">tinyDecoders receiver: wiring</text>
  <text x="20" y="50" fill="#555">Firmware env promicro. Every wire soldered at both ends. Power nets drawn as labels: join them with one splice per net (see WIRING.md).</text>

  <!-- ============ OLED ============ -->
  <rect x="40" y="90" width="190" height="160" rx="6" fill="#e8eef8" stroke="#2a4a80" stroke-width="2"/>
  <text x="52" y="112" font-weight="bold" fill="#2a4a80">OLED 0.91" SSD1306</text>
  <text x="52" y="128" fill="#2a4a80">128x32, I2C 0x3C</text>
  <text x="52" y="236" fill="#2a4a80" font-size="11">pins on the left, text upright</text>
  <g fill="#222" text-anchor="end">
    <text x="222" y="134">SDA</text><text x="222" y="164">SCL</text><text x="222" y="194">VCC</text><text x="222" y="224">GND</text>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="230" cy="130" r="4"/><circle cx="230" cy="160" r="4"/><circle cx="230" cy="190" r="4"/><circle cx="230" cy="220" r="4"/>
  </g>

  <!-- ============ RXB6 ============ -->
  <rect x="40" y="330" width="190" height="190" rx="6" fill="#e6f3e8" stroke="#2a7a3a" stroke-width="2"/>
  <text x="52" y="352" font-weight="bold" fill="#2a7a3a">RXB6 433 MHz</text>
  <text x="52" y="368" fill="#2a7a3a" font-size="11">flipped, pin stubs up</text>
  <text x="52" y="506" fill="#2a7a3a" font-size="11">DATA-end pins: check silkscreen</text>
  <g fill="#222" text-anchor="end">
    <text x="222" y="364">+5V</text><text x="222" y="404">DER</text><text x="222" y="444">DATA</text><text x="222" y="484">GND</text>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="230" cy="360" r="4"/><circle cx="230" cy="400" r="4"/><circle cx="230" cy="440" r="4"/><circle cx="230" cy="480" r="4"/>
    <circle cx="40" cy="425" r="4"/>
  </g>
  <text x="48" y="429" fill="#222">ANT</text>
  <text x="236" y="404" fill="#888" font-size="11">n.c.</text>
  <!-- helical antenna -->
  <path d="M36,425 H24 V400 m0,0 l-8,-4 l16,-6 l-16,-6 l16,-6 l-16,-6 l16,-6 l-8,-4" fill="none" stroke="#b8860b" stroke-width="2"/>
  <text x="8" y="580" fill="#8a6500" font-size="11">ANT: helical antenna</text>
  <text x="8" y="594" fill="#8a6500" font-size="11">27.5 x Ø5 mm, soldered</text>
  <line x1="24" y1="566" x2="24" y2="420" stroke="#8a6500" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ Pro Micro ============ -->
  <rect x="380" y="90" width="220" height="410" rx="6" fill="#e3ecf7" stroke="#1a5fa0" stroke-width="2"/>
  <rect x="460" y="70" width="60" height="26" rx="3" fill="#c8c8c8" stroke="#555" stroke-width="1.5"/>
  <text x="490" y="66" text-anchor="middle" fill="#555" font-size="11">micro-USB (rear wall)</text>
  <text x="490" y="118" text-anchor="middle" font-weight="bold" fill="#1a5fa0">Pro Micro 5 V / 16 MHz</text>
  <text x="490" y="133" text-anchor="middle" fill="#1a5fa0" font-size="11">top view</text>
  <text x="490" y="492" text-anchor="middle" fill="#1a5fa0" font-size="11">front (pins 9 / 10)</text>
  <g fill="#222" font-size="11">
    <text x="410" y="154">TX0</text>
    <text x="410" y="182">RX1</text>
    <text x="410" y="210">GND</text>
    <text x="410" y="238">GND</text>
    <text x="410" y="266" font-weight="bold">2 SDA</text>
    <text x="410" y="294" font-weight="bold">3 SCL</text>
    <text x="410" y="322" font-weight="bold">4 ICP1</text>
    <text x="410" y="350">5</text>
    <text x="410" y="378">6</text>
    <text x="410" y="406">7</text>
    <text x="410" y="434">8</text>
    <text x="410" y="462">9</text>
  </g>
  <g fill="#222" font-size="11" text-anchor="end">
    <text x="570" y="154">RAW</text>
    <text x="570" y="182" font-weight="bold">GND</text>
    <text x="570" y="210">RST</text>
    <text x="570" y="238" font-weight="bold">VCC</text>
    <text x="570" y="266">A3</text>
    <text x="570" y="294">A2</text>
    <text x="570" y="322">A1</text>
    <text x="570" y="350">A0</text>
    <text x="570" y="378">15</text>
    <text x="570" y="406">14</text>
    <text x="570" y="434">16</text>
    <text x="570" y="462">10</text>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="400" cy="150" r="4"/><circle cx="580" cy="150" r="4"/>
    <circle cx="400" cy="178" r="4"/><circle cx="580" cy="178" r="4"/>
    <circle cx="400" cy="206" r="4"/><circle cx="580" cy="206" r="4"/>
    <circle cx="400" cy="234" r="4"/><circle cx="580" cy="234" r="4"/>
    <circle cx="400" cy="262" r="4"/><circle cx="580" cy="262" r="4"/>
    <circle cx="400" cy="290" r="4"/><circle cx="580" cy="290" r="4"/>
    <circle cx="400" cy="318" r="4"/><circle cx="580" cy="318" r="4"/>
    <circle cx="400" cy="346" r="4"/><circle cx="580" cy="346" r="4"/>
    <circle cx="400" cy="374" r="4"/><circle cx="580" cy="374" r="4"/>
    <circle cx="400" cy="402" r="4"/><circle cx="580" cy="402" r="4"/>
    <circle cx="400" cy="430" r="4"/><circle cx="580" cy="430" r="4"/>
    <circle cx="400" cy="458" r="4"/><circle cx="580" cy="458" r="4"/>
  </g>

  <!-- ============ Signal wires ============ -->
  <!-- SDA: green -->
  <path d="M234,130 H350 V262 H396" fill="none" stroke="#1f9e3a" stroke-width="3"/>
  <!-- SCL: yellow -->
  <path d="M234,160 H330 V290 H396" fill="none" stroke="#d9a400" stroke-width="3"/>
  <!-- DATA: green, 1 ring -->
  <path d="M234,440 H360 V318 H396" fill="none" stroke="#1f9e3a" stroke-width="3"/>
  <rect x="356" y="370" width="8" height="10" fill="#999" stroke="#555"/>
  <text x="246" y="433" fill="#1f9e3a" font-size="11">DATA (1 ring)</text>

  <!-- pull-ups 3.3k to VCC, at the Pro Micro end -->
  <circle cx="300" cy="130" r="3.5" fill="#222"/>
  <line x1="300" y1="130" x2="300" y2="112" stroke="#222" stroke-width="1.5"/>
  <rect x="294" y="82" width="12" height="30" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="82" x2="300" y2="74" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="70" text-anchor="middle" fill="#c00" font-weight="bold">VCC</text>
  <text x="310" y="100" fill="#222" font-size="11">R1 3.3k</text>
  <circle cx="300" cy="160" r="3.5" fill="#222"/>
  <line x1="300" y1="160" x2="300" y2="178" stroke="#222" stroke-width="1.5"/>
  <rect x="294" y="178" width="12" height="30" fill="#fff" stroke="#222" stroke-width="1.5"/>
  <line x1="300" y1="208" x2="300" y2="218" stroke="#222" stroke-width="1.5"/>
  <text x="300" y="232" text-anchor="middle" fill="#c00" font-weight="bold">VCC</text>
  <text x="310" y="198" fill="#222" font-size="11">R2 3.3k</text>
  <text x="236" y="250" fill="#555" font-size="10">pull-ups at the Pro Micro end</text>

  <!-- ============ Power net labels ============ -->
  <!-- OLED -->
  <line x1="234" y1="190" x2="262" y2="190" stroke="#c00" stroke-width="3"/><text x="266" y="194" fill="#c00" font-weight="bold">VCC</text>
  <line x1="234" y1="220" x2="262" y2="220" stroke="#222" stroke-width="3"/><use href="#gnd" x="262" y="220"/>
  <!-- RXB6 -->
  <line x1="234" y1="360" x2="262" y2="360" stroke="#c00" stroke-width="3"/><text x="266" y="364" fill="#c00" font-weight="bold">VCC</text>
  <line x1="234" y1="480" x2="262" y2="480" stroke="#222" stroke-width="3"/><use href="#gnd" x="262" y="480"/>
  <!-- Pro Micro -->
  <line x1="584" y1="234" x2="620" y2="234" stroke="#c00" stroke-width="3"/><text x="624" y="238" fill="#c00" font-weight="bold">VCC</text>
  <line x1="584" y1="178" x2="640" y2="178" stroke="#222" stroke-width="3"/><use href="#gnd" x="640" y="178"/>
  <text x="624" y="258" fill="#555" font-size="11">VCC pin under the RXB6 shield:</text>
  <text x="624" y="272" fill="#555" font-size="11">one red wire out, flat, sideways</text>
  <text x="664" y="172" fill="#555" font-size="11">use this GND (rear of the RXB6,</text>
  <text x="664" y="186" fill="#555" font-size="11">not under the shield)</text>

  <!-- RXB6 decoupling -->
  <text x="260" y="548" font-weight="bold" fill="#222">RXB6 decoupling, on the DATA-end stubs</text>
  <text x="300" y="574" text-anchor="middle" fill="#c00" font-weight="bold">VCC</text>
  <line x1="300" y1="580" x2="300" y2="596" stroke="#222" stroke-width="1.5"/>
  <line x1="290" y1="596" x2="310" y2="596" stroke="#222" stroke-width="2"/><line x1="290" y1="602" x2="310" y2="602" stroke="#222" stroke-width="2"/>
  <line x1="300" y1="602" x2="300" y2="612" stroke="#222" stroke-width="1.5"/><use href="#gnd" x="300" y="612"/>
  <text x="316" y="603" fill="#222" font-size="11">C1 100 nF ceramic</text>
  <text x="440" y="574" text-anchor="middle" fill="#c00" font-weight="bold">VCC</text>
  <line x1="440" y1="580" x2="440" y2="596" stroke="#222" stroke-width="1.5"/>
  <line x1="430" y1="596" x2="450" y2="596" stroke="#222" stroke-width="2"/><line x1="430" y1="602" x2="450" y2="602" stroke="#222" stroke-width="2"/>
  <line x1="440" y1="602" x2="440" y2="612" stroke="#222" stroke-width="1.5"/><use href="#gnd" x="440" y="612"/>
  <text x="456" y="603" fill="#222" font-size="11">C2 10 µF ceramic</text>
  <text x="580" y="574" fill="#555" font-size="11">optional: 10–47 Ω in series</text>
  <text x="580" y="588" fill="#555" font-size="11">in the RXB6 +5V, before C2</text>

  <!-- legend -->
  <g font-size="11" fill="#222">
    <text x="700" y="320" font-weight="bold">Wire colours</text>
    <line x1="700" y1="336" x2="730" y2="336" stroke="#c00" stroke-width="3"/><text x="738" y="340">VCC 5 V (red)</text>
    <line x1="700" y1="354" x2="730" y2="354" stroke="#222" stroke-width="3"/><text x="738" y="358">GND (black)</text>
    <line x1="700" y1="372" x2="730" y2="372" stroke="#1f9e3a" stroke-width="3"/><text x="738" y="376">data: SDA, DATA (+1 ring)</text>
    <line x1="700" y1="390" x2="730" y2="390" stroke="#d9a400" stroke-width="3"/><text x="738" y="394">clock: SCL (yellow)</text>
    <text x="700" y="418">Same-name labels are one net.</text>
    <text x="700" y="434">Crossing lines without a dot</text>
    <text x="700" y="450">are not connected.</text>
  </g>
</svg>
