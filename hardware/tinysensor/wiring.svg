<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>tinySensor v3.0 board: connectors and off-board modules</title>
  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#222">tinySensor v3.0 (emitter): connectors and off-board modules</text>
  <text x="20" y="50" fill="#555">Pin numbers from the v3.0 schematic. Fit only the modules your build uses. Wire colours follow the project convention.</text>

  <!-- ================= board ================= -->
  <rect x="340" y="80" width="320" height="560" rx="8" fill="#eef3ea" stroke="#3d6b2f" stroke-width="2"/>
  <text x="500" y="104" text-anchor="middle" font-weight="bold" fill="#3d6b2f">tinySensor v3.0 — ATtiny84A</text>

  <!-- left connectors: pin dots at x=340 -->
  <g font-size="11" fill="#222">
    <text x="350" y="134" font-weight="bold">J13 RAW IN</text>
    <text x="350" y="152">1 +RAW (□)</text><text x="350" y="172">2 GND</text>
    <text x="350" y="214" font-weight="bold">J2 3.3 V module</text>
    <text x="350" y="232">1 +BATT</text><text x="350" y="252">2 GND</text><text x="350" y="272">3 VCC</text>
    <text x="350" y="324" font-weight="bold">J8 EXT. INT0</text>
    <text x="350" y="342">1 PB2</text><text x="350" y="362">2 GND</text>
    <text x="350" y="604" font-weight="bold">J4 Digital out</text>
    <text x="350" y="622">1 PA7 · 2 GND</text>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="340" cy="148" r="4"/><circle cx="340" cy="168" r="4"/>
    <circle cx="340" cy="228" r="4"/><circle cx="340" cy="248" r="4"/><circle cx="340" cy="268" r="4"/>
    <circle cx="340" cy="338" r="4"/><circle cx="340" cy="358" r="4"/>
  </g>

  <!-- right connectors: pin dots at x=660 -->
  <g font-size="11" fill="#222" text-anchor="end">
    <text x="650" y="134" font-weight="bold">J1 RADIO</text>
    <text x="650" y="152">1 GND</text><text x="650" y="172">2 VCC</text><text x="650" y="192">3 DATA PB0</text>
    <text x="650" y="234" font-weight="bold">J3 I2C 1 (or J14 I2C 2)</text>
    <text x="650" y="252">1 SENSOR_VCC</text><text x="650" y="272">2 GND</text><text x="650" y="292">3 SCL PA4</text>
    <text x="650" y="312">4 SDA PA6</text><text x="650" y="332">5 n.c.</text><text x="650" y="352">6 SDO (JP6)</text>
    <text x="650" y="404" font-weight="bold">J5 OneWire</text>
    <text x="650" y="422">1 SENSOR_VCC</text><text x="650" y="442">2 GND</text><text x="650" y="462">3 DQ PA3</text>
    <text x="650" y="514" font-weight="bold">J7 Analog</text>
    <text x="650" y="532">1 SENSOR_VCC</text><text x="650" y="552">2 AIN PA0</text><text x="650" y="572">3 GND (JP4 2-3)</text>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="660" cy="148" r="4"/><circle cx="660" cy="168" r="4"/><circle cx="660" cy="188" r="4"/>
    <circle cx="660" cy="248" r="4"/><circle cx="660" cy="268" r="4"/><circle cx="660" cy="288" r="4"/><circle cx="660" cy="308" r="4"/><circle cx="660" cy="328" r="4"/><circle cx="660" cy="348" r="4"/>
    <circle cx="660" cy="418" r="4"/><circle cx="660" cy="438" r="4"/><circle cx="660" cy="458" r="4"/>
    <circle cx="660" cy="528" r="4"/><circle cx="660" cy="548" r="4"/><circle cx="660" cy="568" r="4"/>
  </g>

  <!-- ================= left modules ================= -->
  <!-- battery -->
  <rect x="40" y="120" width="190" height="70" rx="6" fill="#fbecec" stroke="#a02020" stroke-width="2"/>
  <text x="50" y="140" font-weight="bold" fill="#a02020">Battery (one source)</text>
  <text x="50" y="156" font-size="11" fill="#a02020">2×AA / 2×AAA, or 18650</text>
  <text x="50" y="171" font-size="11" fill="#a02020">through a TP4056 module (OUT±)</text>
  <path d="M230,148 H336" stroke="#c00" stroke-width="3" fill="none"/>
  <path d="M230,168 H336" stroke="#222" stroke-width="3" fill="none"/>
  <text x="240" y="144" font-size="10" fill="#c00">+ red</text><text x="240" y="182" font-size="10" fill="#222">− black</text>

  <!-- regulator -->
  <rect x="40" y="210" width="190" height="80" rx="6" fill="#eef0fb" stroke="#3a46a0" stroke-width="2"/>
  <text x="50" y="228" font-weight="bold" fill="#3a46a0">3.3 V module</text>
  <text x="50" y="243" font-size="11" fill="#3a46a0">TPS63020 (18650 + BME280)</text>
  <text x="50" y="257" font-size="11" fill="#3a46a0">or boost (2×AA/AAA)</text>
  <text x="50" y="278" font-size="11" fill="#3a46a0">VIN · GND · VOUT</text>
  <path d="M230,228 H336" stroke="#c00" stroke-width="3" fill="none"/>
  <path d="M230,248 H336" stroke="#222" stroke-width="3" fill="none"/>
  <path d="M230,268 H336" stroke="#f0f0f0" stroke-width="5" fill="none"/><path d="M230,268 H336" stroke="#999" stroke-width="1" fill="none" stroke-dasharray="1,0"/>
  <text x="240" y="224" font-size="10" fill="#c00">VIN red</text><text x="240" y="262" font-size="10" fill="#222">GND black</text><text x="240" y="282" font-size="10" fill="#666">VOUT white</text>
  <text x="40" y="306" font-size="10" fill="#555">TPS63020: EN to VIN, PS/SYNC to GND. No module: JP2 closed.</text>

  <!-- LM35 switch -->
  <rect x="40" y="322" width="190" height="56" rx="6" fill="#f6efe6" stroke="#8a5a2b" stroke-width="2"/>
  <text x="50" y="340" font-weight="bold" fill="#8a5a2b">LM35 variant only</text>
  <text x="50" y="355" font-size="11" fill="#8a5a2b">BC327 switch of a 5 V boost</text>
  <text x="50" y="369" font-size="11" fill="#8a5a2b">see VARIANTE_LM35.md</text>
  <path d="M230,338 H336" stroke="#8a5a2b" stroke-width="3" fill="none"/>
  <path d="M230,358 H336" stroke="#222" stroke-width="3" fill="none"/>
  <text x="240" y="334" font-size="10" fill="#8a5a2b">PB2 brown</text>

  <!-- ================= right modules ================= -->
  <!-- radio -->
  <rect x="770" y="120" width="190" height="80" rx="6" fill="#eef6fb" stroke="#1a6a90" stroke-width="2"/>
  <text x="780" y="140" font-weight="bold" fill="#1a6a90">433 MHz OOK emitter</text>
  <text x="780" y="156" font-size="11" fill="#1a6a90">STX882, FS1000A… pin order</text>
  <text x="780" y="170" font-size="11" fill="#1a6a90">differs: match by name</text>
  <text x="780" y="190" font-size="11" fill="#1a6a90">antenna 17.3 cm (λ/4)</text>
  <path d="M664,148 H770" stroke="#3a6ad0" stroke-width="3" fill="none"/>
  <path d="M664,168 H770" stroke="#f0f0f0" stroke-width="5" fill="none"/><path d="M664,168 H770" stroke="#999" stroke-width="1" fill="none"/>
  <path d="M664,188 H770" stroke="#1f9e3a" stroke-width="3" fill="none"/>
  <text x="690" y="144" font-size="10" fill="#3a6ad0">GND blue</text><text x="690" y="164" font-size="10" fill="#666">VCC white</text><text x="690" y="184" font-size="10" fill="#1f9e3a">DATA green</text>
  <path d="M960,160 h20 v-60" stroke="#b8860b" stroke-width="2" fill="none"/>

  <!-- BME280 -->
  <rect x="770" y="230" width="190" height="130" rx="6" fill="#f3eefb" stroke="#5a3a90" stroke-width="2"/>
  <text x="780" y="250" font-weight="bold" fill="#5a3a90">BME280 / BMP280 breakout</text>
  <text x="780" y="266" font-size="11" fill="#5a3a90">VIN GND SCL SDA CSB SDO</text>
  <text x="780" y="284" font-size="11" fill="#5a3a90">Mushroom: plugs straight into J3</text>
  <text x="780" y="298" font-size="11" fill="#5a3a90">(6-way female header), no wire</text>
  <text x="780" y="318" font-size="11" fill="#5a3a90">CSB must be pulled up on the</text>
  <text x="780" y="332" font-size="11" fill="#5a3a90">breakout (10 kΩ to VIN): check</text>
  <text x="780" y="350" font-size="11" fill="#5a3a90">max 3.6 V on VIN</text>
  <path d="M664,248 H770" stroke="#f0f0f0" stroke-width="5" fill="none"/><path d="M664,248 H770" stroke="#999" stroke-width="1" fill="none"/>
  <path d="M664,268 H770" stroke="#3a6ad0" stroke-width="3" fill="none"/>
  <path d="M664,288 H770" stroke="#d9a400" stroke-width="3" fill="none"/>
  <path d="M664,308 H770" stroke="#1f9e3a" stroke-width="3" fill="none"/>
  <path d="M664,328 H770" stroke="#8a3ab9" stroke-width="2" fill="none" stroke-dasharray="5,4"/>
  <path d="M664,348 H770" stroke="#1f9e3a" stroke-width="3" fill="none"/><rect x="712" y="343" width="8" height="10" fill="#999" stroke="#555"/>
  <text x="680" y="244" font-size="10" fill="#666">white</text><text x="680" y="264" font-size="10" fill="#3a6ad0">blue</text><text x="680" y="284" font-size="10" fill="#9a7400">SCL yellow</text>
  <text x="680" y="304" font-size="10" fill="#1f9e3a">SDA green</text><text x="680" y="324" font-size="10" fill="#8a3ab9">CSB n.c.</text><text x="680" y="362" font-size="10" fill="#1f9e3a">SDO green, 1 ring</text>

  <!-- DS18B20 -->
  <rect x="770" y="400" width="190" height="70" rx="6" fill="#eef6ee" stroke="#2a7a3a" stroke-width="2"/>
  <text x="780" y="420" font-weight="bold" fill="#2a7a3a">DS18B20 (TO-92)</text>
  <text x="780" y="436" font-size="11" fill="#2a7a3a">sensor pins GND, DQ, VDD:</text>
  <text x="780" y="450" font-size="11" fill="#2a7a3a">not J5 order, cross the wires</text>
  <path d="M664,418 H770" stroke="#f0f0f0" stroke-width="5" fill="none"/><path d="M664,418 H770" stroke="#999" stroke-width="1" fill="none"/>
  <path d="M664,438 H770" stroke="#3a6ad0" stroke-width="3" fill="none"/>
  <path d="M664,458 H770" stroke="#1f9e3a" stroke-width="3" fill="none"/>
  <text x="680" y="414" font-size="10" fill="#666">VDD white</text><text x="680" y="434" font-size="10" fill="#3a6ad0">GND blue</text><text x="680" y="472" font-size="10" fill="#1f9e3a">DQ green</text>

  <!-- analog -->
  <rect x="770" y="510" width="190" height="70" rx="6" fill="#f6efe6" stroke="#8a5a2b" stroke-width="2"/>
  <text x="780" y="530" font-weight="bold" fill="#8a5a2b">Analog sensor (3 pins)</text>
  <text x="780" y="546" font-size="11" fill="#8a5a2b">TMP36 / LM35 on SENSOR_VCC;</text>
  <text x="780" y="560" font-size="11" fill="#8a5a2b">LM35 on 5 V: see VARIANTE_LM35</text>
  <path d="M664,528 H770" stroke="#f0f0f0" stroke-width="5" fill="none"/><path d="M664,528 H770" stroke="#999" stroke-width="1" fill="none"/>
  <path d="M664,548 H770" stroke="#8a5a2b" stroke-width="3" fill="none"/>
  <path d="M664,568 H770" stroke="#3a6ad0" stroke-width="3" fill="none"/>
  <text x="680" y="524" font-size="10" fill="#666">+Vs white</text><text x="680" y="544" font-size="10" fill="#8a5a2b">Vout brown</text><text x="680" y="582" font-size="10" fill="#3a6ad0">GND blue</text>

  <!-- legend -->
  <g font-size="11" fill="#222">
    <text x="40" y="440" font-weight="bold">Wire colours</text>
    <line x1="40" y1="456" x2="70" y2="456" stroke="#c00" stroke-width="3"/><text x="78" y="460">battery + (red)</text>
    <line x1="40" y1="474" x2="70" y2="474" stroke="#222" stroke-width="3"/><text x="78" y="478">battery − (black)</text>
    <line x1="40" y1="492" x2="70" y2="492" stroke="#f0f0f0" stroke-width="5"/><line x1="40" y1="492" x2="70" y2="492" stroke="#999" stroke-width="1"/><text x="78" y="496">regulated + (white)</text>
    <line x1="40" y1="510" x2="70" y2="510" stroke="#3a6ad0" stroke-width="3"/><text x="78" y="514">regulated − (blue, power only)</text>
    <line x1="40" y1="528" x2="70" y2="528" stroke="#1f9e3a" stroke-width="3"/><text x="78" y="532">data (green)</text>
    <line x1="40" y1="546" x2="70" y2="546" stroke="#d9a400" stroke-width="3"/><text x="78" y="550">clock (yellow)</text>
    <line x1="40" y1="564" x2="70" y2="564" stroke="#8a3ab9" stroke-width="3"/><text x="78" y="568">select (purple)</text>
    <line x1="40" y1="582" x2="70" y2="582" stroke="#8a5a2b" stroke-width="3"/><text x="78" y="586">enable / analog (brown)</text>
  </g>
  <!-- on-board notes -->
  <rect x="40" y="660" width="920" height="120" rx="6" fill="#fafafa" stroke="#bbb"/>
  <g font-size="11" fill="#333">
    <text x="52" y="680" font-weight="bold">On the board (no extra part needed)</text>
    <text x="52" y="698">• SENSOR_VCC = PA2: J3, J5, J7, J14 are powered only while measuring</text>
    <text x="52" y="714">• I2C pull-ups R2/R3 4.7 kΩ and 1-Wire pull-up R6 4.7 kΩ, to SENSOR_VCC</text>
    <text x="52" y="730">• Battery sense R7/R8 1 MΩ divider: PA1 reads Vbatt / 2</text>
    <text x="52" y="746">• Q1 AO3401A: reverse-polarity protection on J13 and BT1 (not on J10 CR2032)</text>
    <text x="52" y="762">• BT1 18650 holder, J10 CR2032, J13: one battery source only</text>
    <text x="520" y="698">• JP2 DIRECT Vcc: VCC = battery; close only when J2 is empty</text>
    <text x="520" y="714">• JP6 SDO (J3/J14 pin 6): 1-2 GND = I2C 0x76 (default), 2-3 MISO = SPI</text>
    <text x="520" y="730">• JP4 2-3: J7 pin 3 = GND; JP3 closed: 1 µF filter on PA0</text>
    <text x="520" y="746">• JP1: LED on PB1 (leave open to save power)</text>
    <text x="520" y="762">• ISP J6: MISO PA5, VCC, SCK PA4, MOSI PA6, RST, GND (shared with I2C)</text>
  </g>
</svg>
