id_format:
  categories: [FUNC, TECH, PERF, UI, CONF, PLAT]
  levels: ["domain"]
  example: "FUNC-OREGON-001"

test_tagging:
  language: cpp
  framework: unity
  convention: "@req {id}"  # C++: "// @req {id}" above the test function; bench sheet: "<!-- @req {id} -->" on its first line
  bench_sheets: "tests/bench/{id}.md"  # manual test of a requirement no software test can cover

linter:
  # tinyDecoders/ is the 433 MHz receiver sub-project; its .pio/ build tree is skipped
  command: "find emitter/src emitter/include emitter/test lib tinyDecoders -path '*/.pio' -prune -o \\( -name '*.cpp' -o -name '*.h' \\) -print | xargs clang-format --dry-run --Werror"

# commit prefixes outside the RBD code cycle, accepted by the pre-push hook
extra_commit_prefixes: [hw]
