id_format:
  categories: [FUNC, TECH, PERF, UI, CONF, PLAT]
  levels: ["domain"]
  example: "FUNC-OREGON-001"

test_tagging:
  language: cpp
  framework: unity
  convention: "// @req {id}"  # placed above the test function

linter:
  # tinyDecoders/ is the 433 MHz receiver sub-project; its .pio/ build tree is skipped
  command: "find src lib include test tinyDecoders -path '*/.pio' -prune -o \\( -name '*.cpp' -o -name '*.h' \\) -print | xargs clang-format --dry-run --Werror"

# commit prefixes outside the RBD code cycle, accepted by the pre-push hook
extra_commit_prefixes: [hw]
