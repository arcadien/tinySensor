# Install once: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8  # keep in sync with the CI lint job
    hooks:
      - id: clang-format
        types_or: [c, c++]
        files: ^(src|lib|include|test)/
